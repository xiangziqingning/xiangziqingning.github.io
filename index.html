<script>
const SUPABASE_URL = "https://lwcuqcddipwmvauykjic.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx3Y3VxY2RkaXB3bXZhdXlramljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzNDE1MzMzImV4cCI6MjA5MzkxNzUzM30.ERnWXOOjtflnE71pXVgYdjF1D3AXkutxX1WDkJAFbdg";

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function loadResources(){
  const list = document.getElementById("list");
  list.innerHTML = "正在加载...";

  const { data, error } = await db
    .from("resources")
    .select("*")
    .order("id", { ascending:false });

  if(error){
    list.innerHTML = "读取失败：" + error.message;
    return;
  }

  if(!data || data.length === 0){
    list.innerHTML = "暂无资源，先发布一个试试。";
    return;
  }

  list.innerHTML = "";
  data.forEach(item=>{
    list.innerHTML += `
      <div class="card">
        <h3>${item.title || "未命名资源"}</h3>
        <span class="tag">${item.category || "未分类"}</span>
        <p>${item.description || "暂无介绍"}</p >
        ${item.link ? `<a href=" " target="_blank">打开资源链接</a >` : ""}
      </div>
    `;
  });
}

async function addResource(){
  const title = document.getElementById("title").value.trim();
  const category = document.getElementById("category").value;
  const description = document.getElementById("description").value.trim();
  const link = document.getElementById("link").value.trim();

  if(!title){
    alert("资源名称不能为空");
    return;
  }

  const { error } = await db.from("resources").insert([
    { title, category, description, link }
  ]);

  if(error){
    alert("发布失败：" + error.message);
    return;
  }

  alert("发布成功！");
  document.getElementById("title").value="";
  document.getElementById("description").value="";
  document.getElementById("link").value="";
  loadResources();
}

loadResources();
</script>
