<script>
const SUPABASE_URL = "https://lwc...
.supabase.co";

const SUPABASE_KEY = "你的KEY";

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let editingId = null;

async function loadResources() {
  const list = document.getElementById("list");
  list.innerHTML = "正在加载...";

  const { data, error } = await db
    .from("resources")
    .select("*")
    .order("id", { ascending: false });

  if (error) {
    list.innerHTML = "读取失败：" + error.message;
    return;
  }

  if (!data || data.length === 0) {
    list.innerHTML = "暂无资源";
    return;
  }

  list.innerHTML = "";

  data.forEach(item => {
    list.innerHTML += `
      <div class="card">
        <h3>${item.title}</h3>

        <span class="tag">${item.category}</span>

        <p>${item.description || "暂无介绍"}</p >

        ${
          item.link
            ? `<a href=" " target="_blank">打开资源</a >`
            : ""
        }

        <div style="margin-top:15px;display:flex;gap:10px;">
          <button onclick="editResource(${item.id})">
            编辑
          </button>

          <button onclick="deleteResource(${item.id})"
          style="background:#ef4444;color:white;">
            删除
          </button>
        </div>
      </div>
    `;
  });
}

async function addResource() {
  const title = document.getElementById("title").value.trim();
  const category = document.getElementById("category").value;
  const description =
    document.getElementById("description").value.trim();

  const link = document.getElementById("link").value.trim();

  if (!title) {
    alert("资源名称不能为空");
    return;
  }

  // 防止重复
  const { data: exist } = await db
    .from("resources")
    .select("*")
    .eq("title", title);

  if (exist && exist.length > 0 && editingId === null) {
    alert("该资源已经存在");
    return;
  }

  if (editingId) {

    const { error } = await db
      .from("resources")
      .update({
        title,
        category,
        description,
        link
      })
      .eq("id", editingId);

    if (error) {
      alert(error.message);
      return;
    }

    alert("修改成功");
    editingId = null;

  } else {

    const { error } = await db
      .from("resources")
      .insert([
        {
          title,
          category,
          description,
          link
        }
      ]);

    if (error) {
      alert(error.message);
      return;
    }

    alert("发布成功");
  }

  clearForm();
  loadResources();
}

async function deleteResource(id) {

  if (!confirm("确定删除吗？")) return;

  const { error } = await db
    .from("resources")
    .delete()
    .eq("id", id);

  if (error) {
    alert(error.message);
    return;
  }

  alert("删除成功");
  loadResources();
}

async function editResource(id) {

  const { data } = await db
    .from("resources")
    .select("*")
    .eq("id", id)
    .single();

  if (!data) return;

  editingId = id;

  document.getElementById("title").value =
    data.title || "";

  document.getElementById("category").value =
    data.category || "";

  document.getElementById("description").value =
    data.description || "";

  document.getElementById("link").value =
    data.link || "";

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}

function clearForm() {
  document.getElementById("title").value = "";
  document.getElementById("description").value = "";
  document.getElementById("link").value = "";
}

loadResources();
</script>
