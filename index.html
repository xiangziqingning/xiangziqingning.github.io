  }

  clearForm();
  backHome();
  loadResources();

async function deleteResource(id){
  if(!confirm("确定删除这个资源吗？"))return;
  const {error}=await db.from("resources").delete().eq("id",id);
  if(error){alert("删除失败："+error.message);return;}
  alert("删除成功");
  backHome();
  loadResources();
}

async function editResource(id){
  const {data,error}=await db.from("resources").select("*").eq("id",id).single();
  if(error){alert("读取失败："+error.message);return;}

  editingId=id;
  document.getElementById("title").value=data.title||"";
  document.getElementById("category").value=data.category||"AI工具";
  document.getElementById("description").value=data.description||"";
  document.getElementById("image").value=data.image||"";
  document.getElementById("link").value=data.link||"";
  document.getElementById("formTitle").innerText="正在编辑资源";

  backHome();
  window.scrollTo(0,0);
}

function clearForm(){
  document.getElementById("title").value="";

  document.getElementById("image").value="";
